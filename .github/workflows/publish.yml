name: Publish to npm

# Tokenless OIDC trusted publishing from a GitHub Release - see AGENTS.d/030-publishing-is-tokenless-oidc-from-a-release.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance + OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # ensure OIDC/provenance support
      - run: npm ci
      - run: node scripts/check-package.mjs # refuse to publish if runtime deps leaked in
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # prepack rebuilds dist; --provenance signs it. No NODE_AUTH_TOKEN - see the rule above.
      - run: npm publish --provenance --access public
